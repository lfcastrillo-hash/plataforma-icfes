name: SonarQube Cloud OIDC
on:
  workflow_dispatch:
  # Primera ejecución sin instalar este archivo en main. Publicar únicamente con autorización.
  push:
    branches: ['ci/sonar-oidc-validation']
permissions:
  contents: read
  id-token: write
concurrency:
  group: sonar-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    if: github.ref == 'refs/heads/ci/sonar-oidc-validation' || github.ref == 'refs/heads/codex/sonar-metricas-20261122'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      QA_DATABASE_ENGINE: pglite
      QA_EVIDENCE_ROOT: .qa-sonar
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm run test:coverage
      - run: node scripts/qa/validate-lcov.cjs .qa-sonar/pruebas-unitarias/lcov.info
      - name: Authenticate with GitHub OIDC
        uses: SonarSource/sonarqube-auth-action@v1
        id: auth
        with:
          project-key: lfcastrillo-hash_plataforma-icfes
          sonar-region: eu
      - name: Analyze and wait for the original Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >-
            -Dproject.settings=.sonarcloud.properties
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.projectKey=${{ steps.auth.outputs.project-key }}
            -Dsonar.organization=${{ steps.auth.outputs.organization }}
            -Dsonar.javascript.lcov.reportPaths=.qa-sonar/pruebas-unitarias/lcov.info
            -Dsonar.qualitygate.wait=true
