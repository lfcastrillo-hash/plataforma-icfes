<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil - Estudiante</title>
    <link rel="stylesheet" href="css/global.css" />
  </head>
  <body>
    <header class="navbar navbar-estudiante">
      <button class="menu-toggle" id="btn-menu" onclick="toggleMenu()">
        <div></div>
        <div></div>
        <div></div>
      </button>

      <h1>Mi Perfil</h1>

      <div class="nav-right">
        <div
          style="display: flex; align-items: center; gap: 10px; color: white"
        >
          <span
            id="nav-nombre-estudiante"
            style="font-size: 14px; opacity: 0.85"
          ></span>
          <a
            href="perfil-estudiante.html"
            id="nav-avatar"
            class="profile-nav-icon"
            style="
              background: #3d8bfd;
              margin: 0;
              cursor: pointer;
              text-decoration: none;
            "
            >E</a
          >
        </div>
        <a
          href="#"
          onclick="cerrarSesion()"
          style="font-size: 13px; opacity: 0.85; margin-left: 20px"
          >Cerrar sesión</a
        >
      </div>
    </header>

    <aside class="sidebar-oculta" id="sidebar-menu">
      <div class="titulo-panel">Panel</div>
      <nav style="display: flex; flex-direction: column; gap: 5px">
        <a href="panel-estudiante.html" class="nav-item">Inicio</a>
        <a href="areas.html" class="nav-item">Áreas</a>
        <a href="clases_grabadas.html" class="nav-item">Clases Grabadas</a>
        <a href="cuadernillos.html" class="nav-item">Cuadernillos</a>
        <a href="simulacro-selector.html" class="nav-item">Simulacros</a>
        <a href="#" class="nav-item">Material Extra</a>
      </nav>
    </aside>

    <main class="contenido-dinamico" id="contenido-principal">
      <div
        style="
          display: block;
          max-width: 800px;
          margin: 0 auto;
          text-align: center;
          background: white;
          padding: 50px 40px;
          border-radius: 12px;
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
          position: relative;
        "
      >
        <div
          style="
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
          "
        >
          <button
            onclick="abrirModalEditar()"
            style="
              background: white;
              border: 1px solid #3d8bfd;
              color: #3d8bfd;
              padding: 8px 15px;
              border-radius: 6px;
              cursor: pointer;
              font-weight: bold;
              font-size: 13px;
              transition: all 0.2s;
            "
          >
            ✏️ Editar Perfil
          </button>
          <button
            onclick="abrirModalSeguridad()"
            style="
              background: white;
              border: 1px solid #64748b;
              color: #64748b;
              padding: 8px 15px;
              border-radius: 6px;
              cursor: pointer;
              font-weight: bold;
              font-size: 13px;
              transition: all 0.2s;
            "
          >
            🔒 Seguridad
          </button>
        </div>

        <div
          style="
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #3d8bfd;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            font-weight: bold;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(61, 139, 253, 0.3);
          "
          id="foto-preview-main"
        >
          <span id="estudiante-avatar-grande">E</span>
        </div>

        <h2
          id="estudiante-nombre"
          style="font-size: 26px; color: #123c73; margin-bottom: 5px"
        >
          Cargando...
        </h2>
        <span
          style="
            background-color: #e0f2fe;
            color: #0284c7;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
          "
          >Estudiante</span
        >

        <p
          id="perfil-biografia"
          style="
            text-align: center;
            color: #64748b;
            font-size: 15px;
            max-width: 500px;
            margin: 0 auto 20px auto;
          "
        ></p>

        <div
          class="stats-profile-grid"
          style="
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #eef2f7;
          "
        >
          <div class="stat-profile-item">
            <span id="stat-talleres">0</span>
            <label>Simulacros</label>
          </div>
          <div class="stat-profile-item">
            <span id="stat-meta">350</span>
            <label>Meta Puntaje</label>
          </div>
          <div class="stat-profile-item">
            <span id="stat-tiempo">0h</span>
            <label>Tiempo Estudio</label>
          </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 35px 0" />

        <div style="text-align: left; max-width: 600px; margin: 0 auto">
          <h4 style="color: #123c73; margin-bottom: 15px; font-size: 16px">
            Mis Clases y Grupos
          </h4>
          <div
            id="lista-clases-perfil"
            style="display: flex; flex-direction: column; gap: 10px"
          >
            <p style="color: #888; font-size: 14px">Cargando clases...</p>
          </div>
        </div>
      </div>

      <div id="modal-editar-perfil" class="modal-overlay" style="display: none">
        <div class="modal-box" style="position: relative; max-width: 450px">
          <button
            onclick="cerrarModalEditar()"
            style="
              position: absolute;
              top: 15px;
              right: 20px;
              background: none;
              border: none;
              font-size: 24px;
              color: #666;
              cursor: pointer;
            "
          >
            &times;
          </button>

          <div style="padding: 30px">
            <h3 style="color: #123c73; margin-bottom: 5px; font-size: 1.3rem">
              Editar Perfil
            </h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 20px">
              Actualiza tu información pública.
            </p>

            <form id="form-perfil">
              <div style="text-align: center; margin-bottom: 20px">
                <label
                  for="input-foto"
                  style="
                    cursor: pointer;
                    color: #3d8bfd;
                    font-weight: bold;
                    font-size: 14px;
                  "
                  >📷 Cambiar foto de perfil</label
                >
                <input
                  type="file"
                  id="input-foto"
                  accept="image/*"
                  style="display: none"
                />
              </div>

              <label style="font-size: 13px; font-weight: bold; color: #555"
                >Nombre Completo</label
              >
              <input
                type="text"
                id="update-nombre"
                style="
                  width: 100%;
                  padding: 12px;
                  margin-top: 5px;
                  margin-bottom: 15px;
                  border: 1px solid #ccc;
                  border-radius: 8px;
                "
              />

              <label style="font-size: 13px; font-weight: bold; color: #555"
                >Biografía (Metas, intereses...)</label
              >
              <textarea
                id="update-biografia"
                rows="3"
                style="
                  width: 100%;
                  padding: 12px;
                  margin-top: 5px;
                  margin-bottom: 20px;
                  border: 1px solid #ccc;
                  border-radius: 8px;
                  resize: vertical;
                  font-family: Arial;
                "
              ></textarea>

              <button
                type="button"
                onclick="guardarPerfil()"
                class="btn"
                style="width: 100%"
              >
                Guardar Cambios
              </button>
            </form>
          </div>
        </div>
      </div>

      <div id="modal-seguridad" class="modal-overlay" style="display: none">
        <div class="modal-box" style="position: relative; max-width: 450px">
          <button
            onclick="cerrarModalSeguridad()"
            style="
              position: absolute;
              top: 15px;
              right: 20px;
              background: none;
              border: none;
              font-size: 24px;
              color: #666;
              cursor: pointer;
            "
          >
            &times;
          </button>

          <div style="padding: 30px">
            <h3 style="color: #c62828; margin-bottom: 5px; font-size: 1.3rem">
              Seguridad y Acceso
            </h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 20px">
              Actualiza tus credenciales para iniciar sesión.
            </p>

            <form id="form-seguridad">
              <label style="font-size: 13px; font-weight: bold; color: #555"
                >Correo Electrónico Actual</label
              >
              <input
                type="email"
                id="update-correo"
                style="
                  width: 100%;
                  padding: 12px;
                  margin-top: 5px;
                  margin-bottom: 15px;
                  border: 1px solid #ccc;
                  border-radius: 8px;
                "
              />

              <label style="font-size: 13px; font-weight: bold; color: #555"
                >Nueva Contraseña (Opcional)</label
              >
              <input
                type="password"
                id="update-password"
                placeholder="Déjalo en blanco si no cambias"
                style="
                  width: 100%;
                  padding: 12px;
                  margin-top: 5px;
                  margin-bottom: 20px;
                  border: 1px solid #ccc;
                  border-radius: 8px;
                "
              />

              <button
                type="button"
                onclick="guardarSeguridad()"
                class="btn"
                style="width: 100%; background: #c62828"
              >
                Actualizar Accesos
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <button
      class="chat-btn"
      onclick="abrirChat()"
      style="
        position: fixed;
        bottom: 20px;
        right: 20px;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        font-size: 24px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 9999;
        border: none;
        background: #3d8bfd;
        cursor: pointer;
      "
    >
      🤖
    </button>

    <script src="js/chat-ia.js"></script>

    <script src="js/perfil-estudiante.js"></script>
  </body>
</html>
