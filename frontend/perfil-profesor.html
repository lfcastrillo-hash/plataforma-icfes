<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mi Perfil - ICFES Prep</title>
  <link rel="stylesheet" href="css/global.css" />
</head>
<body class="dashboard-profesor">

  <header class="navbar">
    <h1>Mi Perfil</h1>
    <div class="nav-right">
      <a href="panel-profesor.html" style="font-size:13px; opacity:0.85; margin-right: 15px;">Volver al Panel</a>
      <a href="index.html" style="font-size:13px; opacity:0.85;">Cerrar sesión</a>
    </div>
  </header>

  <main class="profile-container">
    
    <div class="cards-profile-row" style="display: block; max-width: 900px; margin: 0 auto; text-align: center; background: white; padding: 50px 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative;">
      
      <div style="position: absolute; top: 30px; right: 30px; display: flex; flex-direction: column; gap: 10px;">
          <button onclick="abrirModalEditar()" style="background: white; border: 1px solid #0ea5e9; color: #0ea5e9; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; transition: all 0.2s;">
            Editar Perfil
          </button>
          <button onclick="abrirModalSeguridad()" style="background: white; border: 1px solid #64748b; color: #64748b; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; transition: all 0.2s;">
            Seguridad y Acceso
          </button>
      </div>

      <div style="width: 120px; height: 120px; border-radius: 50%; background-color: #e2e8f0; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #64748b; font-weight: bold; overflow: hidden;" id="foto-preview-main">
          <span id="nav-avatar-text">P</span>
      </div>

      <h2 id="perfil-nombre" style="font-size: 28px; color: #2c3e50; text-transform: uppercase; margin-bottom: 5px;">Cargando...</h2>
      <span style="background-color: #e0f2fe; color: #0284c7; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; display: inline-block; margin-bottom: 20px;">Profesor</span>

      <div style="text-align: center; color: #4b5563; font-size: 16px; max-width: 600px; margin: 0 auto;">
          <p id="perfil-biografia"><i>Sin descripción...</i></p>
      </div>

      <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 40px 0;">

      <div style="text-align: left; max-width: 700px; margin: 0 auto;">
          <h4 style="color: #64748b; margin-bottom: 15px; font-size: 18px;">Perfiles de curso asignados</h4>
          <div id="lista-clases-perfil" style="display: flex; flex-direction: column; gap: 10px;">
              </div>
      </div>
    </div>

    <div id="modal-editar-perfil" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center;">
      <div style="background: white; padding: 35px; border-radius: 12px; width: 90%; max-width: 450px; position: relative;">
          <button onclick="cerrarModalEditar()" style="position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 24px; color: #666; cursor: pointer;">&times;</button>
          
          <h3 style="color: #123c73; margin-bottom: 5px;">Editar Perfil</h3>
          <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Modifica cómo te ven los demás.</p>

          <form id="form-perfil" enctype="multipart/form-data">
              <div style="text-align: center; margin-bottom: 20px;">
                  <label for="input-foto" style="cursor: pointer; color: #0ea5e9; font-weight: bold; font-size: 14px;">📷 Cambiar foto de perfil</label>
                  <input type="file" id="input-foto" accept="image/*" style="display: none;" />
                  <div id="mini-preview" style="margin-top: 5px; font-size: 12px; color: #888;"></div>
              </div>

              <label style="font-size: 13px; font-weight: bold;">Nombre Completo</label>
              <input type="text" id="update-nombre" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px;" />

              <label style="font-size: 13px; font-weight: bold;">Sobre mí (Descripción)</label>
              <textarea id="update-biografia" rows="3" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; resize: vertical;"></textarea>

              <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; background: #123c73; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Guardar Perfil</button>
          </form>
      </div>
    </div>

    <div id="modal-seguridad" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center;">
      <div style="background: white; padding: 35px; border-radius: 12px; width: 90%; max-width: 450px; position: relative;">
          <button onclick="cerrarModalSeguridad()" style="position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 24px; color: #666; cursor: pointer;">&times;</button>
          
          <h3 style="color: #c62828; margin-bottom: 5px;">Seguridad y Acceso</h3>
          <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Actualiza tus credenciales de entrada.</p>

          <form id="form-seguridad">
              <label style="font-size: 13px; font-weight: bold;">Correo Electrónico Actual</label>
              <input type="email" id="update-correo" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px;" />

              <label style="font-size: 13px; font-weight: bold;">Nueva Contraseña (Opcional)</label>
              <input type="password" id="update-password" placeholder="Déjalo en blanco si no quieres cambiarla" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px;" />

              <button type="submit" class="btn btn-danger" style="width: 100%; padding: 14px; background: #c62828; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Actualizar Accesos</button>
          </form>
      </div>
    </div>

  </main>
  <script src="js/perfil-profesor.js"></script>
</body>
</html>
