services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prepicfes_test
      POSTGRES_USER: prepicfes_test
      POSTGRES_PASSWORD: fixture_local_only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepicfes_test -d prepicfes_test"]
      interval: 5s
      timeout: 3s
      retries: 10
